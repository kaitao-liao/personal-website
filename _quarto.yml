project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - about.qmd
    - experience.qmd
    - projects.qmd
    - contact.qmd
    - 404.qmd
  resources:
    - robots.txt
    - assets/icons/bootstrap-icons.woff

website:
  title: "Kaitao Liao | Industrial and Systems Engineering"
  site-url: "https://kaitao-liao.github.io/personal-website/"
  site-path: "/personal-website/"
  description: "Kaitao Liao studies Industrial and Systems Engineering at Georgia Tech, with interests in quantitative research and data-driven decision problems."
  favicon: assets/images/favicon-placeholder.svg # TODO: Replace with your final favicon.
  open-graph:
    title: "Kaitao Liao | Industrial and Systems Engineering"
    description: "Georgia Tech student focused on quantitative research and data-driven decision problems."
    site-name: "Kaitao Liao"
  page-navigation: false
  search: false
  navbar: false

format:
  html:
    theme: none
    css:
      - assets/icons/bootstrap-icons.css
      - styles.css
    toc: false
    smooth-scroll: true
    include-in-header:
      text: |
        <meta name="theme-color" content="#0a192f">
        <meta name="robots" content="index, follow">
    include-before-body:
      - header.html
    include-after-body:
      - footer.html
      - scripts.html

execute:
  freeze: auto
