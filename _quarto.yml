project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - about.qmd
    - work.qmd
    - research.qmd
    - projects.qmd
    - contact.qmd
    - 404.qmd
  resources:
    - robots.txt
    - assets/icons/bootstrap-icons.woff
    - airline-dashboard/index.html
    - assets/images/airline-dashboard-cover.png

website:
  title: "https://kaitaoliao.com"
  site-url: "https://kaitaoliao.com/"
  description: "Kaitao Liao studies Industrial Engineering at Georgia Tech, with interests in quantitative research and data-driven decision problems."
  favicon: assets/images/favicon-placeholder.svg # TODO: Replace with your final favicon.
  open-graph:
    title: "Kaitao Liao | Personal Website"
    description: "Georgia Tech student focused on quantitative research and data-driven decision problems."
    site-name: "https://kaitaoliao.com"
  page-navigation: false
  search: false
  navbar: false

format:
  html:
    theme: none
    css:
      - assets/icons/bootstrap-icons.css
      - styles.css
    toc: false
    canonical-url: true
    smooth-scroll: true
    include-in-header:
      text: |
        <meta name="theme-color" content="#0a192f">
        <meta name="robots" content="index, follow">
    include-before-body:
      - header.html
    include-after-body:
      - footer.html
      - scripts.html

execute:
  freeze: auto
